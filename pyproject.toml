[project]
name = "epstein-rag"
version = "0.1.0"
description = "Epstein documents RAG with Cognee-style ingestion and Postgres storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "tiktoken>=0.7.0",
  "psycopg[binary]>=3.1.0",
  "unstructured>=0.15.0",
  "pypdf>=4.0.0",
  "requests>=2.32.0",
  "pgvector>=0.3.0",
  "pyyaml>=6.0.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "ipython",
]

[project.scripts]
epstein-rag = "main:main"
epstein-rag-api = "api_server:main"
